<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoveEverly</title><style>html,body{margin:0;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}small{color:#9fb3c8;max-width:680px;display:block;line-height:1.5}.spin{width:34px;height:34px;border:4px solid #27405a;border-top-color:#35c2ff;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="loading"><div><h1>MoveEverly</h1><div class="spin"></div><small>Loading your exercise app…</small></div></div><script>(async()=>{const box=document.getElementById('loading');try{if(!('DecompressionStream'in window))throw new Error('This browser needs a newer Safari version to open MoveEverly.');const urls=['app/part00.txt?v=4','app/part01.txt?v=4','app/part02.txt?v=4'];const responses=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));for(const r of responses){if(!r.ok)throw new Error('Could not load an app file ('+r.status+').');}const encoded=(await Promise.all(responses.map(r=>r.text()))).join('').replace(/\s/g,'');const binary=atob(encoded);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();if(!html.startsWith('<!doctype html>'))throw new Error('The app data did not decode correctly.');html=html.replace('</body>','<script src="app/preset-patch.js?v=4"><\/script><script src="app/bodymap-patch.js?v=5"><\/script></body>');document.open();document.write(html);document.close()}catch(e){box.innerHTML='<div><h1>MoveEverly</h1><p>Unable to load the app.</p><small>'+String(e)+'</small><p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 18px;background:#35c2ff;color:#04263a;font-weight:800">Try again</button></p></div>'}})();</script></body></html>
